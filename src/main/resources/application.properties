# ---------- Application ----------
spring.application.name=movie-ticket-booking
server.port=8080

# ---------- Database: MySQL (the only database of this project) ----------
# Every movie, showtime, booking, payment and customer is stored in a MySQL database called `movie_booking`.
# The schema is created and updated automatically on startup (spring.jpa.hibernate.ddl-auto=update).
# The tables are filled from the MySQL import tables (import_movies / import_users / import_showtimes)
# `database/cinemax_mysql_setup.sql` creates the database, user and tables in advance if you prefer.
#
# Default connection - this project's MySQL login, so the app starts with no extra setup:
#   host localhost - port 3306 - database movie_booking - user root - password 0000
# Change the default on the next two lines if your own login is different, or override it at run time
# without touching this file:
#   DB_HOST  DB_PORT  DB_NAME  DB_USER  DB_PASS
#   DB_DIALECT  (MySQLDialect for MySQL 8, MariaDBDialect for MariaDB)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:movie_booking}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=LOCAL&forceConnectionTimeZoneToSession=false
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# READ COMMITTED: the seat-clash check runs after a pessimistic lock on the showtime row, so the waiting
# transaction must see the booking the other one just committed. MySQL's default (REPEATABLE READ) keeps its
# old snapshot and would let two customers book the same seat; READ COMMITTED gives the intended result.
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.MySQLDialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# A booking's seat list is its own small query; batches of 50 keep lists and reports at one round trip each.
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.show-sql=false
# Give a readable error instead of a long stack trace when the database server is not running.
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.initialization-fail-timeout=10000

# ---------- JSON ----------
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------- Reports (timestamped text reports land here) ----------

app.data.reports-dir=data/reports
app.currency=LKR

# ---------- Customer email (confirmations, show reminders, hold expiry) ----------
# outbox (default): emails are written to data/outbox/outbox.txt. Nothing is sent to the internet.
# smtp: emails are sent through the SMTP server below. Set these as environment variables, never in code:
#   APP_EMAIL_MODE=smtp  SMTP_HOST  SMTP_PORT  SMTP_USER  SMTP_PASS  SMTP_STARTTLS  SMTP_AUTH  MAIL_FROM
app.email.mode=${APP_EMAIL_MODE:outbox}
app.email.from=${MAIL_FROM:CineMax <bookings@cinemax.lk>}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASS:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ---------- Show reminders (customer notifications) ----------
app.reminders.interval-ms=60000
app.reminders.initial-delay-ms=15000

# ---------- Seat holds ----------
# Unpaid bookings keep their seats for this many minutes, then the seats are released.
app.booking.hold-minutes=10
app.booking.hold-sweep-ms=30000

# ---------- Sessions and cookies (admin security) ----------
# Idle sessions end after 30 minutes. The session cookie is HttpOnly (not readable by page scripts)
# and SameSite=Lax (not sent on cross-site form posts).
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Secure = the browser only sends the session cookie over HTTPS. Keep false for local http:// demos;
# set SESSION_COOKIE_SECURE=true once the site is served over HTTPS.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# ---------------------------------------------------------------------------
# OpenAPI / Swagger UI (Tier 3)
# The live API document is at /v3/api-docs and the browsable page at /swagger-ui.html.
# Swagger UI is only an aid for developers: it is switched off in production by setting
# SPRINGDOC_ENABLED=false.
# ---------------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.default-models-expand-depth=-1
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:true}
