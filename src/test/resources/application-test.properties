# Used only by the automated tests (mvn test). MySQL, like the application - no H2 anywhere.
# A separate database (movie_booking_test) is used so your real data in movie_booking is never touched.
# The tables are created before the first test and dropped after the last one (create-drop),
# so every run starts from an empty schema; tests build the rows they need themselves.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:movie_booking_test}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=LOCAL&forceConnectionTimeZoneToSession=false
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# The schema is empty on every run (create-drop), so the test run fills the MySQL import tables first.
# defer-datasource-initialization delays the script until Hibernate has created the tables.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:test-seed.sql
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.MySQLDialect}
app.email.outbox-dir=target/test-outbox

# Scheduled jobs are pushed far out in tests so the tests call the sweeps themselves.
app.reminders.initial-delay-ms=3600000
app.reminders.interval-ms=3600000
app.booking.hold-sweep-ms=3600000

# No demo sales history in the tests: the tests build exactly the rows they need, so the numbers they
# assert on stay predictable and the run stays fast.
cinemax.demo.history=false
